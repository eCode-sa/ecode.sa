<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الموقع تحت الصيانة | Electronic Code</title>
  <meta name="description" content="موقع شركة إلكترونيك كود تحت الصيانة حالياً. سنعود قريباً." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{cairo:['Cairo','sans-serif'],outfit:['Outfit','sans-serif']},colors:{primary:'#4F46E5',secondary:'#7C3AED',dark:'#0f172a',darker:'#020617'}}}}
  </script>
  
  <link rel="icon" type="image/png" href="/favicon.webp" />
  
  <style>
    :root{--text-main:'Cairo',sans-serif}html[lang=en]{--text-main:'Outfit',sans-serif}body{font-family:var(--text-main)}
    .gradient-text{background:linear-gradient(to right,#4F46E5,#9333EA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .logo-container{display:flex;align-items:center;gap:12px;text-decoration:none}.logo-icon img{height:44px;width:auto;border-radius:8px;object-fit:contain}.logo-text{display:flex;flex-direction:column}.brand-name{font-weight:800;font-size:1.25rem;line-height:1.1;color:#1e293b}html.dark .brand-name{color:#f8fafc}.brand-tagline{font-size:.75rem;color:#64748b;font-weight:600}html.dark .brand-tagline{color:#94a3b8}
    .gear-icon {
        animation: spin 8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-darker dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full py-6 px-6 md:px-12 flex justify-between items-center z-50">
    <div class="logo-container">
      <div class="logo-icon">
        <img src="https://ecode.sa/favicon.webp" alt="eCode Logo" onerror="this.src='https://via.placeholder.com/44x44?text=eCode'">
      </div>
      <div class="logo-text">
        <div class="brand-name" data-i18n="brand_name">eCode</div>
        <div class="brand-tagline" data-i18n="brand_tagline">تصنع الأثر</div>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <button class="hover:text-primary transition text-xl" onclick="toggleTheme()" aria-label="Toggle Theme">
        <i class="fas fa-sun" id="theme-icon"></i>
      </button>
      <button onclick="toggleLanguage()" class="transition transform hover:scale-110 text-2xl" aria-label="Switch Language">
        <span id="lang-icon">🇬🇧</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center relative overflow-hidden">
    <!-- Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-30 dark:opacity-20 pointer-events-none">
      <div class="absolute top-[10%] right-[10%] w-[400px] h-[400px] rounded-full bg-primary blur-[100px]"></div>
      <div class="absolute bottom-[10%] left-[10%] w-[500px] h-[500px] rounded-full bg-secondary blur-[100px]"></div>
    </div>

    <div class="container mx-auto px-6 text-center z-10">
      <div class="text-6xl md:text-8xl text-primary mb-8 opacity-80 gear-icon inline-block">
        <i class="fa-solid fa-gear"></i>
      </div>
      
      <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight">
        <span data-i18n="maint_title_1">نحن نقوم ببعض</span><br>
        <span class="gradient-text" data-i18n="maint_title_2">التحديثات المستمرة</span>
      </h1>
      
      <p class="text-lg md:text-xl text-gray-600 dark:text-gray-400 mb-10 max-w-2xl mx-auto leading-relaxed font-medium" data-i18n="maint_desc">
        الموقع مغلق للصيانة حالياً لتحسين تجربتكم. نعمل بجهد للعودة في أقرب وقت ممكن. شكراً لتفهمكم وصبركم!
      </p>
      
      <div class="flex flex-wrap justify-center gap-4">
        <a href="https://wa.me/966503666316" target="_blank" class="px-8 py-4 rounded-full bg-[#25D366] text-white font-bold hover:shadow-lg transition transform hover:-translate-y-1 flex items-center gap-3">
          <i class="fa-brands fa-whatsapp text-2xl"></i>
          <span data-i18n="btn_contact">تواصل معنا للاستفسارات</span>
        </a>
      </div>
      
      <!-- Social Media Links -->
      <div class="mt-12 flex justify-center gap-4">
        <a href="https://x.com/eCode_sa" target="_blank" class="text-gray-400 hover:text-primary transition text-2xl"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://www.instagram.com/ecode_sa" target="_blank" class="text-gray-400 hover:text-primary transition text-2xl"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.linkedin.com/company/ecode-sa" target="_blank" class="text-gray-400 hover:text-primary transition text-2xl"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center border-t border-gray-200 dark:border-gray-800 text-sm text-gray-500 dark:text-gray-400 z-10" data-i18n="footer_copyright">
    © 2026 شركة إلكترونيك كود. جميع الحقوق محفوظة.
  </footer>

  <script>
    const translations = {
      ar: {
        brand_name: 'eCode',
        brand_tagline: 'تصنع الأثر',
        maint_title_1: 'نحن نقوم ببعض',
        maint_title_2: 'التحديثات المستمرة',
        maint_desc: 'الموقع مغلق للصيانة حالياً لتحسين تجربتكم. نعمل بجهد للعودة في أقرب وقت ممكن. شكراً لتفهمكم وصبركم!',
        btn_contact: 'تواصل معنا للاستفسارات',
        footer_copyright: '© 2026 شركة إلكترونيك كود. جميع الحقوق محفوظة.'
      },
      en: {
        brand_name: 'eCode',
        brand_tagline: 'Innovate Impact',
        maint_title_1: 'We are making some',
        maint_title_2: 'Important Updates',
        maint_desc: 'Our website is currently under maintenance to improve your experience. We are working hard to be back as soon as possible. Thank you for your patience!',
        btn_contact: 'Contact Us for Inquiries',
        footer_copyright: '© 2026 Electronic Code Company. All rights reserved.'
      }
    };

    let currentLang = localStorage.getItem('userLanguage') || 'ar';

    function initTheme() {
      const icon = document.getElementById('theme-icon');
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
      } else {
        document.documentElement.classList.remove('dark');
        icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.theme = 'light';
        icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
      } else {
        html.classList.add('dark');
        localStorage.theme = 'dark';
        icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
      }
    }

    function updateContent() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang] && translations[currentLang][key]) {
          el.innerHTML = translations[currentLang][key];
        }
      });
      document.title = currentLang === 'ar' ? 'الموقع تحت الصيانة | Electronic Code' : 'Under Maintenance | Electronic Code';
    }

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const html = document.documentElement;
      const langIcon = document.getElementById('lang-icon');
      if (currentLang === 'ar') {
        html.setAttribute('lang', 'ar'); html.setAttribute('dir', 'rtl');
        langIcon.textContent = '🇬🇧';
      } else {
        html.setAttribute('lang', 'en'); html.setAttribute('dir', 'ltr');
        langIcon.textContent = '🇸🇦';
      }
      localStorage.setItem('userLanguage', currentLang);
      updateContent();
    }

    window.onload = () => {
      const html = document.documentElement;
      const langIcon = document.getElementById('lang-icon');
      if (currentLang === 'ar') {
        html.setAttribute('lang', 'ar'); html.setAttribute('dir', 'rtl');
        langIcon.textContent = '🇬🇧';
      } else {
        html.setAttribute('lang', 'en'); html.setAttribute('dir', 'ltr');
        langIcon.textContent = '🇸🇦';
      }
      initTheme();
      updateContent();
    };
  </script>
</body>
</html>
